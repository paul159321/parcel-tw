[build-system]
requires = ["hatchling", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[project]
name = "parcel_tw"
version = "0.0.6"
authors = [
    { name = "ryanycs" }
]
description = "The Python package for Taiwan parcel tracking."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dynamic = ["dependencies"]

[project.optional-dependencies]
test = [
    "pytest",
    "python-dotenv",
]

[project.urls]
"Homepage" = "https://github.com/ryanycs/parcel_tw"
"Issues" = "https://github.com/ryanycs/parcel_tw/issues"

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]

[tool.pytest.ini_options]
pythonpath = ["."]
log_cli = true
log_cli_level = "INFO"
markers = [
    "live: tests that call external carrier services and require real tracking IDs",
]
